# Runs the tests on every push to main and every pull request, so a broken change is found
# before a tag is pushed. The acceptance tests run the real Terraform CLI against a fake
# control plane; they need no credentials.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
        env:
          TF_ACC: "1"
